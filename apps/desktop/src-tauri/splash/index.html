<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>AI Video Factory</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(900px 500px at 60% 0%, #1a1650, transparent 60%), #090e22;
    color: #e9ecf8; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .logo { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #8b6cff, #6a46f5);
    display: grid; place-items: center; box-shadow: 0 10px 40px rgba(123, 86, 255, .5); }
  h1 { margin: 0; font-size: 26px; letter-spacing: .3px; }
  p { margin: 0; color: #b4bbd8; }
  .bar { width: 260px; height: 6px; border-radius: 9px; background: #212b55; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 9px; background: linear-gradient(90deg, #7b56ff, #19d3b5);
    animation: run 1.2s ease-in-out infinite; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  #err { display: none; max-width: 620px; text-align: center; color: #ffb1c1; line-height: 1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M7 4v16l13-8z"/></svg></div>
    <h1>AI VIDEO FACTORY</h1>
    <p id="msg">Đang khởi động dịch vụ AI local…</p>
    <div class="bar" id="bar"><i></i></div>
    <div id="err"></div>
  </div>
</body>
</html>
